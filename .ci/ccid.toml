schema = 1
project = "cmsh"

[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"], ["node", "--version"], ["python3", "--version"], ["jq", "--version"], ["curl", "--version"], ["git", "--version"], ["gcc", "--version"], ["pkg-config", "--version"], ["sqlite3", "--version"]]
cache_env = ["PKG_CONFIG_PATH", "NIX_CFLAGS_COMPILE", "NIX_LDFLAGS", "LD_LIBRARY_PATH", "CI_TOR_LIB_OUT", "CI_TOR_LIB_DEV"]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt", "dependency-metadata.json", "records-metadata.json"]

[checks.records]
kind = "commands"
# Live private Tor network: a result is never replayed from a cache.
cache = false
commands = [["ccid", "tor", "records"]]

[checks.v01-tor-live]
kind = "commands"
# Live private Tor network: a result is never replayed from a cache.
cache = false
commands = [["ccid", "tor", "v01-tor-live"]]

[render]
tool_revision = "bd9aff07073185fb0a3503bab331aedefb6d8fd2"
tool_sha256 = "38c0eadf2a2adb406f83c7d4892bc01a0a10b95671e1e671358e43a257bb5d23"
[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["verify"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]

[jobs.records]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["records"]
workflow = "records"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]

[jobs.v01-tor-live]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["v01-tor-live"]
workflow = "v01-tor-live"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]
