schema = 1
project = "cmsh"
repository = "https://git.corbet.ch/corbet-libs/cmsh.git"

[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"], ["node", "--version"], ["python3", "--version"], ["jq", "--version"], ["curl", "--version"], ["git", "--version"], ["gcc", "--version"], ["pkg-config", "--version"], ["sqlite3", "--version"]]
cache_env = ["PKG_CONFIG_PATH", "NIX_CFLAGS_COMPILE", "NIX_LDFLAGS", "LD_LIBRARY_PATH"]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt", "dependency-metadata.json", "records-metadata.json"]

[render]
tool_revision = "e38f347d6941aa105ac4b55a0d4b8fec2ef22433"

[jobs.verify]
scheduler = "crow"
checks = ["verify"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

[push_consumer.cmsg-v01]
consumer = "https://git.corbet.ch/corbet-libs/cmsg.git"
branch = "v01"
consumer_branch = "v01"
job = "v01-push"
self_name = "cmsh"
