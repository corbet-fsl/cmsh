schema = 1

# Frozen nine-onion inputs for the v01-tor-live workflow only. The dispatch
# helper never builds these (it reads `.ci/archives.toml` alone); the Rust
# job resolves each path from its Crow variable (or the committed default)
# and verifies it against the committed digest before any use. Ambient tool
# paths are referenced in place, never copied, so Nix runtime closures stay
# valid. Frozen driver scripts come from the verified root archive below.
# ctrn ca0fab8 carries the listener failure-isolation fix; other product pins
# and the original nine-onion probe assertions remain unchanged.

[live-inputs.v01-source-bundle]
archive_variable = "V01_SOURCE_BUNDLE"
digest_variable = "V01_SOURCE_BUNDLE_SHA256"
sha256 = "65a5c7e1fff9d676b94510cdd2f325f59dc09b24b09fe28bf927729d5b60a87b"
