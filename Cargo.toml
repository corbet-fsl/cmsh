[package]
name = "cmsh"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
description = "P2P transport facade: bounded messages, fallback and guarantees over the cvln and ctrn networks"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-fsl/cmsh.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE.md"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
tor = ["dep:ctrn"]
tor-records = ["tor", "dep:cdht"]
veilid = ["dep:cvln", "dep:cdht"]

[dependencies]
cdht = { git = "https://git.corbet.ch/corbet-libre/cdht.git", branch = "main", optional = true }
cfbk = { git = "https://git.corbet.ch/corbet-libre/cfbk.git", branch = "main" }
ctrn = { git = "https://git.corbet.ch/corbet-foss/ctrn.git", branch = "main", default-features = false, optional = true }
futures = "0.3"
zeroize = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
schemars = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cvln = { git = "https://git.corbet.ch/corbet-foss/cvln.git", branch = "main", optional = true }

[dev-dependencies]
cfry = { git = "https://git.corbet.ch/corbet-libre/cfry.git", branch = "main" }
tokio = { version = "1.47", features = ["io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
veilid-core-optimized = { git = "https://gitlab.com/veilid/veilid.git", branch = "main", default-features = false, features = ["enable-crypto-vld0"] }
blake3 = "1.8"
cdht = { git = "https://git.corbet.ch/corbet-libre/cdht.git", branch = "main" }
ctrn = { git = "https://git.corbet.ch/corbet-foss/ctrn.git", branch = "main", features = ["arti"] }
ed25519-dalek = { version = "3.0.0", features = ["digest", "hazmat"] }
serde_json = "1"
tempfile = "3"
tor-hscrypto = "0.46"
tor-llcrypto = "0.46"
tor-rtcompat = { version = "0.46", features = ["tokio", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-futures = "0.4"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[[example]]
name = "tor_records"
required-features = ["tor"]

[[example]]
name = "tor_discovery"
required-features = ["tor-records"]
